# =====================================================================
# 第十轮 · 蒸馏版板端模型（KD）：v3@512 教 arm320@320
#   学生结构/配置与 a_nwd_p2_arm320 完全一致，只多一个 distill 块，
#   便于和基线逐 epoch 对比（基线 e1..e5 的 010 mAP30 = .7636/.7796/.8003/.7785/.7917）
# =====================================================================
exp_id: a_nwd_p2_arm320_kd
seed: 0

model:
  nc: 1
  p2: true
  eca: true

pretrained: weights/yolov8n_coco.pt
freeze_backbone: true
freeze_upto: 9

distill:
  enabled: true
  teacher: weights/a_nwd_p2_v3_best.pt
  teacher_imgsz: 512
  weight: 0.8
  proj: true

data:
  mode: tile
  tile: 256
  imgsz: 320
  train_seqs: ["001", "002", "003", "004", "005", "006", "007", "008", "009",
               "011", "012", "013", "014", "015", "016", "017", "018", "019",
               "020", "021", "022", "023", "024", "025", "026", "027",
               "028", "029", "030", "031", "032", "033", "034", "035", "036", "037", "038"]
  val_seqs: ["010"]
  neg_per_frame: 0.35
  min_visible: 0.5
  degrade:
    jpeg_prob: 0.5
    jpeg_q: [30, 70]
    noise_prob: 0.3
    noise_sigma: 3.0

loss:
  box: nwd
  nwd_c: 8.0

train:
  epochs: 4
  batch_size: 16
  lr: 0.002
  warmup_iters: 200
  workers: 6
  weight_decay: 0.0005
  grad_clip: 10.0
  amp: true
  eval_every: 1
  log_every: 200

val:
  proposal: oracle
  batch_size: 8
  nms_iou: 0.5
  conf_floor: 0.05
