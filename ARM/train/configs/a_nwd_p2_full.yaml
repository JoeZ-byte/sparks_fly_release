# =====================================================================
# 全量数据版（第五轮·修正）：剔除 028~038（标注是整幅大框，非逐车）
#   train = 001~009, 011~038（37 段）   val = 010   留出 = 早期外部视频
# 方法与 a_nwd_p2 完全一致：图块 256->512 | P2 头 | NWD | 冻结主干
# 数据规模：37 段 / 约 1.4 万帧 / 约 85 万实例（此前仅 5 段 / 1.2 万实例）
# =====================================================================
exp_id: a_nwd_p2_full2
seed: 0

model:
  nc: 1
  p2: true

pretrained: weights/yolov8n_coco.pt
freeze_backbone: true
freeze_upto: 9

data:
  mode: tile
  tile: 256
  imgsz: 512
  train_seqs: ["001", "002", "003", "004", "005", "006", "007", "008", "009", "011", "012", "013", "014", "015", "016", "017", "018", "019", "020", "021", "022", "023", "024", "025", "026", "027"]
  val_seqs: ["010"]
  neg_per_frame: 1
  min_visible: 0.5

loss:
  box: nwd
  nwd_c: 12.0

train:
  epochs: 5
  batch_size: 16
  lr: 0.002
  warmup_iters: 200
  workers: 6
  weight_decay: 0.0005
  grad_clip: 10.0
  amp: true
  eval_every: 1
  log_every: 200

val:
  proposal: oracle
  batch_size: 8
  nms_iou: 0.5
  conf_floor: 0.05